<!DOCTYPE html>
<html>
<head>
	<meta charset="utf-8">
	<meta name="viewport" content="width=device-width, initial-scale=1">
	<title>Django Sms </title>
</head>
<body>
	<center>
		<h1>Send Sms using Django</h1>
		<form method="POST" action="{% url 'send_sms'%}">
			{% csrf_token %}
			<label>Recipient Phone Number:</label>
			  <input type="text"id="to" name="to" placeholder="+91xxxxxxxxxx"required>
			<br>
			<br>
			<label>Message:</label>
			  <textarea id="message" name="message" rows="4" cols="50" placeholder="Type Your message here"required></textarea>
			<br>
			<br>
			<input type="submit" value="Send SMS">
		</form>
    </center>
</body>
</html>
